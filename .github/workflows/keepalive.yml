name: Keep awake and check

# An outside scheduler, and worth switching on rather than treating as
# optional. The service pings itself to stay awake, but a self ping cannot
# help once the host has stopped it, because a stopped service cannot ping
# anything. Observed on 11 August 2026: an instance was found stopped after a
# stream had been running for 22 minutes, and the announcement was lost.
#
# A cold start makes this worse rather than better. The first check after a
# start records a stream that is already live without announcing it, so a
# service that sleeps through the beginning of a stream stays silent for the
# whole of it. Keeping it awake is what avoids that.
#
# To switch it on, add these repository secrets under
# Settings, Secrets and variables, Actions:
#   SERVICE_URL   one address, or several separated by commas or spaces
#   CRON_SECRET   the same value you set on your host, optional
#
# Several addresses are allowed so one repository can watch more than one
# deployment, such as your own and a friend's. CRON_SECRET only applies to the
# first address, since separate deployments do not share a secret.
#
# Without SERVICE_URL this workflow exits quietly instead of failing, so an
# unconfigured fork never sends you failure emails.

on:
  schedule:
    # Every 10 minutes. GitHub does not allow anything under 5, and busy
    # periods can delay a run, so treat the timing as approximate.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# This job only makes an outbound request, so it is given no access to the
# repository at all. Without this it would inherit the default token
# permissions, which are far wider than it needs.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the service
        env:
          SERVICE_URL: ${{ secrets.SERVICE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          if [ -z "${SERVICE_URL}" ]; then
            echo "SERVICE_URL is not set, so there is nothing to ping. Skipping."
            exit 0
          fi

          failed=0
          first=1

          # Commas are the documented separator, and spaces are accepted too
          # because a list pasted from anywhere tends to arrive with both.
          for raw in $(printf '%s' "${SERVICE_URL}" | tr ',' ' '); do
            base="${raw%/}"
            [ -z "${base}" ] && continue

            echo "Waking ${base}"
            # A stopped free instance can take close to a minute to answer its
            # first request, so allow far longer than a warm service needs.
            if curl -fsS --max-time 90 --retry 3 --retry-delay 15 "${base}/health"; then
              echo
            else
              echo "  could not reach ${base}"
              failed=1
              first=0
              continue
            fi

            if [ -n "${CRON_SECRET}" ] && [ "${first}" = "1" ]; then
              echo "Running a live check on ${base}"
              # Sent as a header so the secret stays out of URLs and server logs.
              curl -fsS --max-time 90 -H "x-cron-key: ${CRON_SECRET}" "${base}/cron" || {
                echo "  the live check failed"
                failed=1
              }
              echo
            fi

            first=0
          done

          exit "${failed}"
